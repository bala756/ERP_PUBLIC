services:
  postgres:
    image: postgres:16-alpine
    container_name: bca-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bca_erp
      POSTGRES_PASSWORD: bca_erp_dev
      POSTGRES_DB: bca_erp
    ports:
      - "5432:5432"
    volumes:
      - bca_erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bca_erp -d bca_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bca_erp_postgres:
