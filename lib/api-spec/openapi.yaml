      tags: [pipeline]
      summary: Get a purchase request with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PR detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestDetail"
    patch:
      operationId: updatePurchaseRequest
      tags: [pipeline]
      summary: Update PR header notes or item quantities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurchaseRequestBody"
      responses:
        "200":
          description: Updated PR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestDetail"

  /purchase-requests/{id}/approve:
    post:
      operationId: approvePurchaseRequest
      tags: [pipeline]
      summary: Approve a PR — creates POs (manufactured + raw) and Import Jobs (imported)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorByItemId:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of PR item id to vendor name (used when creating POs/Import Jobs)
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: PR approved with downstream entities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestDetail"

  /purchase-requests/{id}/reject:
    post:
      operationId: rejectPurchaseRequest
      tags: [pipeline]
      summary: Reject a PR
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Rejected PR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestDetail"

  /stock-movements:
    get:
      operationId: getStockMovements
      tags: [pipeline]
      summary: List cost-stamped stock movements
      parameters:
        - name: workOrderId
          in: query
          schema:
            type: integer
        - name: itemId
          in: query
          schema:
            type: integer
        - name: movementType
          in: query
          schema:
            type: string
            enum: [in, out]
      responses:
        "200":
          description: Movement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"

  /stock-movements/in:
    post:
      operationId: createStockIn
      tags: [pipeline]
      summary: Record a Stores In movement (manual or from upstream source)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockInBody"
      responses:
        "201":
          description: Stores In recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  /stock-movements/out:
    post:
      operationId: createStockOut
      tags: [pipeline]
      summary: Record a Stores Out movement (issue against a WO)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockOutBody"
      responses:
        "201":
          description: Stores Out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  /subcontract-jobs:
    get:
      operationId: getSubcontractJobs
      tags: [pipeline]
      summary: List subcontract jobs
      parameters:
        - name: workOrderId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubcontractJob"
    post:
      operationId: createSubcontractJob
      tags: [pipeline]
      summary: Create a Subcontract Job Out (issues raw materials to a vendor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubcontractJobBody"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcontractJobDetail"

  /subcontract-jobs/{id}:
    get:
      operationId: getSubcontractJob
      tags: [pipeline]
      summary: Get a subcontract job with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcontractJobDetail"

  /subcontract-jobs/{id}/receive:
    post:
      operationId: receiveSubcontractJob
      tags: [pipeline]
      summary: Record receipt of subcontract job (good qty + scrap), posts Stores In with computed unit cost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveSubcontractJobBody"
      responses:
        "200":
          description: Job received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcontractJobDetail"

  /import-jobs/{id}/receive:
    post:
      operationId: receiveImportJobToStores
      tags: [pipeline]
      summary: Mark Import Job received and post Stores In with per-unit landed cost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import job received and posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

